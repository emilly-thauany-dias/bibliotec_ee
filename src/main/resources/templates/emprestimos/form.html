<head th:replace="~{fragments/layout :: cabeca('Novo empréstimo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: menu('emprestimos')}"></nav>
<h1>Novo empréstimo</h1>

<form class="formulario" th:action="@{/emprestimos}" method="post">

    <p class="erro" th:if="${erro}" th:text="${erro}">Mensagem da regra de negócio</p>

    <label for="livroId">Livro</label>
    <select id="livroId" name="livroId">
        <option value="">Selecione...</option>
        <option th:each="l : ${livros}"
                th:value="${l.id}"
                th:selected="${l.id == livroId}"
                th:text="${l.titulo + ' — disponíveis: ' + l.quantidadeDisponivel}">Dom Casmurro — disponíveis: 2</option>
    </select>

    <label for="leitorId">Leitor</label>
    <select id="leitorId" name="leitorId">
        <option value="">Selecione...</option>
        <option th:each="l : ${leitores}"
                th:value="${l.id}"
                th:selected="${l.id == leitorId}"
                th:text="${l.nome + ' (' + l.matricula + ')'}">Ana Souza (2026001)</option>
    </select>

    <div class="acoes">
        <button type="submit" class="botao">Emprestar</button>
        <a class="botao botao-secundario" th:href="@{/emprestimos}">Cancelar</a>
    </div>
</form>

</body>
</html>
